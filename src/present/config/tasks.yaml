transcript_task:
  description: >
    你将收到一段物业或社区来电文本，请先完成标准化整理和事实提取。

    输入文本：
    {input}

    请输出以下内容：
    1. 标准化通话文本
    2. 通话纪要摘要
    3. 事件要素：
       - 来电人身份
       - 时间
       - 地点
       - 问题类型
       - 核心诉求
       - 是否涉及人员、设备或财产风险
       - 紧急程度初判
    4. 当前缺失信息

    要求：
    - 严格依据原始文本，不得臆造
    - 若未明确，写“待补充确认”或“未明确”
    - 输出应便于后续风险判断
  expected_output: >
    一份结构化通话纪要，包含标准化通话文本、摘要、事件要素和当前缺失信息。

risk_analysis_task:
  description: >
    基于 transcript_task 的结果，优先进行风险识别与紧急程度判断。

    请重点判断以下情形是否存在：
    - 火灾、冒烟、燃气泄漏
    - 电梯困人
    - 打架冲突
    - 老人摔倒、人员受伤
    - 严重漏水且可能危及电气安全
    - 停电、消防设施故障等可能引发安全事故的问题

    请输出：
    1. 处理优先级（紧急 / 高 / 中 / 低）
    2. 综合风险等级（高 / 中高 / 中 / 低）
    3. 是否需要立即处置（是 / 否）
    4. 是否需要报警（是 / 否）
    5. 建议报警类型（110 / 119 / 120 / 无）
    6. 是否需要立即通知主管或值班人员（是 / 否）
    7. 建议立即执行的应急动作
    8. 风险分析表，至少包含：
       - 风险类型
       - 风险等级
       - 核心风险点
       - 关键管控措施

    要求：
    - 若涉及人身安全、火警、燃气、电梯困人等，必须优先建议立即应急处置
    - 风险判断必须服务于“先救急，再流转”
  expected_output: >
    一份风险优先分析结果，包含处理优先级、综合风险等级、是否立即处置、是否报警、建议报警类型、应急动作和风险矩阵。

emergency_response_task:
  description: >
    基于 transcript_task 和 risk_analysis_task 的结果，判断是否需要启动紧急联络。

    如果事件属于紧急级别，或者判断“需要立即处置”，请输出：
    1. emergency_required: 是否需要启动紧急联络（true/false）
    2. contacts_to_call: 需要联系的对象列表，每项包含：
       - role: 联系对象角色
       - phone_type: 电话类型（内部值班 / 外部求援）
       - priority: 呼叫顺序
       - reason: 联系原因
    3. emergency_call_script: 适合电话播报的紧急通报话术
    4. internal_alert_script: 适合通知物业内部人员的话术
    5. sms_backup_text: 电话未接通时的短信内容
    6. action_reason: 启动紧急联络的原因

    若不需要启动紧急联络，也要输出：
    - emergency_required: false
    - action_reason
    - 建议继续走常规工单流程

    要求：
    - 电话话术要短、清晰、适合口播
    - 优先表达地点、事件、风险、所需支援
    - 不要编造具体电话号码
  expected_output: >
    一份紧急联络方案，包含是否启动、呼叫对象、电话话术、内部通知话术和短信兜底文本。

community_memory_task:
  description: >
    基于 transcript_task、risk_analysis_task 的结果，
    判断本次来电是否与历史问题、重复投诉或楼栋共性风险有关，形成关键事项卡。

    请输出：
    1. 事项主题
    2. 关联分析：
       - 历史关联性（高 / 中 / 低）
       - 是否重复性问题（是 / 否）
       - 是否可能影响其他住户或公共区域
    3. 特别关注点
    4. 闭环提醒

    要求：
    - 若没有明确历史记录，也要说明“暂未发现直接历史关联”
    - 重点分析扩散风险、责任界定风险、升级风险
  expected_output: >
    一份关键事项卡，包含事项主题、关联分析、特别关注点和闭环提醒。

task_generation_task:
  description: >
    基于 transcript_task、risk_analysis_task、emergency_response_task 和 community_memory_task 的结果，
    生成物业处理工单待办。

    若 emergency_response_task 判断需要立即联络，
    则必须优先生成应急处置类待办，再生成后续维修、协调、回访类待办。

    请输出一个待办表，至少包含：
    - 序号
    - 待办内容
    - 责任角色
    - 优先级
    - 建议时限
    - 完成状态

    责任角色可从以下范围选择：
    - 客服专员
    - 工程维修员
    - 保安
    - 保洁
    - 客服主管
    - 工程主管
    - 系统管理员
    - 社区网格员

    要求：
    - 高风险事件优先安排应急动作
    - 待办必须具体、可执行、可监督
  expected_output: >
    一份区分应急待办和常规待办的标准工单待办表。

clarify_task:
  description: >
    基于前面所有任务结果，生成客服首次回电时的建议追问项，并给出闭环要求。

    请输出：
    1. 客服需补充确认的信息
    2. 建议追问问题
    3. 当前缺失的关键字段
    4. 强制回访要求：
       - 是否必须回访
       - 建议回访时限
       - 回访目的
       - 执行人

    要求：
    - 追问必须贴近物业客服真实通话场景
    - 优先补齐影响派单、应急判断和责任界定的字段
  expected_output: >
    一份客服追问与闭环建议，包含建议追问、缺失字段和回访要求。

final_report_task:
  description: >
    请汇总 transcript_task、risk_analysis_task、emergency_response_task、
    community_memory_task、task_generation_task、clarify_task 的所有结果，
    生成最终《物业来电闭环处理报告》。

    报告必须采用以下结构：

    # 物业来电闭环处理报告

    ## 1. 通话纪要
    - 标准化通话文本
    - 通话纪要摘要
    - 事件要素

    ## 2. 风险优先判断
    - 处理优先级
    - 综合风险等级
    - 是否需要立即处置
    - 是否需要报警
    - 应急动作建议

    ## 3. 紧急联络建议
    - 是否需要启动紧急联络
    - 联系对象
    - 电话话术
    - 短信兜底内容

    ## 4. 关键事项卡
    - 事项主题
    - 关联分析
    - 特别关注点
    - 闭环提醒

    ## 5. 工单待办
    - 工单主题
    - 关联房号
    - 来电人
    - 派单时间
    - 待办表格

    ## 6. 建议追问
    - 客服补充确认信息
    - 建议追问
    - 当前缺失的关键信息
    - 强制回访要求

    要求：
    - 使用标准 Markdown 输出
    - 内容完整、专业，适合直接作为物业内部流转报告
    - 所有内容必须与前序任务保持一致
  expected_output: >
    一份完整的 Markdown 格式《物业来电闭环处理报告》。